name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y yosys cmake g++
      - name: Install Python deps
        run: pip install pybind11 ortools pytest
      - name: Build C++ core and Python extension
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Re-synthesize netlists (checks Yosys flow end to end)
        run: python scripts/synth.py
      - name: Python tests
        run: pytest -q
